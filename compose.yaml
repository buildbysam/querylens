name: querylens

# Usage:
#   cp .env.example .env   # then fill in the "Docker Compose" section
#   docker compose up --build -d
#   docker compose run --rm migrate node scripts/create-admin.js --name "Ada Lovelace" --email ada@example.com
#
# Services:
#   db      - metadata PostgreSQL (not published to the host)
#   migrate - one-off: applies drizzle/ migrations, then exits (Dockerfile target `migrate`)
#   app     - QueryLens on http://localhost:${HOST_PORT:-8000} (Dockerfile target `runtime`)
#
# Secrets come from .env (or the shell) at run time; they are never part of an image.

x-database-url: &database-url postgres://${POSTGRES_USER:-querylens}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-querylens}

# hardening shared by the QueryLens containers.
x-hardening: &hardening
  init: true
  cap_drop: [ALL] # port 8000 needs no Linux capabilities
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *hardening
    build:
      context: .
      target: migrate
    image: querylens-migrate:latest
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *hardening
    build:
      context: .
      target: runtime
    image: querylens-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      DATABASE_URL: *database-url
      COOKIES_SECRET: ${COOKIES_SECRET:?set COOKIES_SECRET in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /app/logs
    ports:
      - "${HOST_PORT:-8000}:8000"
    # read-only root filesystem: the only writable paths are the logs volume and /tmp
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # the app waits up to 10 s for an in-flight collection cycle on SIGTERM
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  logs:
